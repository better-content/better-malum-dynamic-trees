plugins {
    id 'net.minecraftforge.gradle' version '6.0.44'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'eclipse'
    id 'maven-publish'
}

mixin {
    add sourceSets.main, 'better_malum_dynamic_trees.refmap.json'
    config 'better_malum_dynamic_trees.mixins.json'
}

version = project.hasProperty('mod_version') ? project.mod_version : '1.0.0'
group = 'com.bettercontent'
base {
    archivesName = 'better-malum-dynamic-trees'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', 'better_malum_dynamic_trees,minecraft'
        }

        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                better_malum_dynamic_trees {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                better_malum_dynamic_trees {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                better_malum_dynamic_trees {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            args '--mod', 'better_malum_dynamic_trees',
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/'),
                 '--existing-mod', 'dynamictrees',
                 '--existing-mod', 'malum'
            mods {
                better_malum_dynamic_trees {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

if (file('src/gameteststructures').exists()) {
    tasks.register('syncGameTestStructures', Copy) {
        from('src/gameteststructures')
        into(project.file('run-gametest/gameteststructures'))
    }

    tasks.matching { it.name.startsWith('prepareRunGameTestServer') }.configureEach {
        dependsOn(tasks.named('syncGameTestStructures'))
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        url = 'https://harleyoconnor.com/maven'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'
    implementation fg.deobf("com.ferreusveritas.dynamictrees:DynamicTrees-1.20.1:1.4.10")
    compileOnly fg.deobf("curse.maven:malum-484064:6646111")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("curse.maven:lodestone-616457:6213794")
    runtimeOnly fg.deobf("curse.maven:malum-484064:6646111")
    runtimeOnly fg.deobf("curse.maven:lodestone-616457:6213794")
    runtimeOnly fg.deobf("curse.maven:curios-309927:6418456")
    runtimeOnly fg.deobf("curse.maven:just-enough-effect-descriptions-jeed-532286:6172935")
    runtimeOnly fg.deobf("curse.maven:jei-238222:7920915")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('jar') {
    exclude 'com/bettercontent/bettermalumdynamictrees/gametest/**'
    manifest {
        attributes([
                'Specification-Title'     : 'better_malum_dynamic_trees',
                'Specification-Vendor'    : 'better_malum_dynamic_trees',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'better_malum_dynamic_trees'
        ])
    }
}

jar {
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

test {
    useJUnitPlatform()
}

tasks.register('headlessGameTest') {
    group = 'verification'
    description = 'Runs Forge game tests in a headless dedicated server.'
    dependsOn tasks.named('runGameTestServer')
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast deterministic verification lane.'
    dependsOn tasks.named('check')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs the full verification lane, including headless Forge GameTests.'
    dependsOn tasks.named('verifyFast')
    dependsOn tasks.named('headlessGameTest')
}
